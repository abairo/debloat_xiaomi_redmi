# Xiaomi / MIUI - perfil derivado da lista do Redmi Note 10S.
com.bsp.catchlog                      # Ferramenta de captura de logs do sistema (usada para diagnóstico e depuração)
com.mi.global.bbs                     # Comunidade Xiaomi
com.mi.global.shop                    # Xiaomi store
com.mi.globalminusscreen              # Tela inicial do Xiaomi (Mi Assistant/Google Discover na tela inicial)
com.milink.service                    # Serviço Mi Link (compartilhamento de mídia entre dispositivos Xiaomi)
com.miui.analytics                    # Coleta de dados analíticos da Xiaomi (telemetria)
com.miui.backup                       # Serviço de backup do MIUI (faz backup dos dados do usuário)
com.miui.bugreport                    # Relatório de bugs do MIUI (envia logs para a Xiaomi)
com.miui.cloudbackup                  # Backup em nuvem da Xiaomi (sincroniza dados com Mi Cloud)
com.miui.cloudservice                 # Serviço da Xiaomi para integração com Mi Cloud
com.miui.compass                      # Aplicativo de bússola
com.miui.fm                           # Aplicativo de rádio FM da Xiaomi
com.miui.freeform                     # Janelas flutuantes (modo multitarefa, funciona de forma limitada em alguns modelos)
com.miui.micloudsync                  # Sincronização automática de dados com Mi Cloud
com.miui.miservice                    # Services & feedback Xiaomi
com.miui.mishare.connectivity         # Mi Share (compartilhamento de arquivos entre dispositivos Xiaomi)
com.miui.msa.global                   # Serviço de anúncios da Xiaomi (exibe propagandas em apps do sistema)
com.miui.player                       # Player de música nativo do MIUI
com.miui.videoplayer                  # Player de vídeos nativo do MIUI
com.tencent.igxiaomi                  # Pubg
com.tencent.soter.soterserver         # Serviço de autenticação/DRM da Tencent (usado por apps chineses)
com.xiaomi.glgm                       # Serviço de jogos da Xiaomi (Xiaomi Game Center)
com.xiaomi.midrop                     # Mi Drop (hoje chamado de "ShareMe", permite transferências de arquivos via Wi-Fi)
com.xiaomi.mipicks                    # Xiaomi GetApps (loja de aplicativos da Xiaomi)
com.xiaomi.payment                    # Serviços de pagamento Xiaomi (Mi Pay e transações financeiras no ecossistema Xiaomi)
com.xiaomi.scanner                    # Scanner de QR Code e documentos da Xiaomi
com.xiaomi.smarthome                  # Xiaomi smarthome
